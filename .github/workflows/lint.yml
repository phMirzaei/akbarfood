name: Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  pint:
    name: PSR-12 (Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # Only the files this PR touches. The pre-existing codebase has widespread
      # violations; checking everything would fail every PR for unrelated reasons.
      - name: Check code style on changed files
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          FILES=$(git diff --name-only --diff-filter=ACMR "origin/$BASE...HEAD" -- '*.php')

          if [ -z "$FILES" ]; then
            echo "No PHP files changed — nothing to check."
            exit 0
          fi

          echo "Checking:"
          echo "$FILES"
          echo "$FILES" | xargs -d '\n' vendor/bin/pint --test

      - name: How to fix
        if: failure()
        run: |
          echo "::notice::Run 'vendor/bin/pint' locally and commit the result."
